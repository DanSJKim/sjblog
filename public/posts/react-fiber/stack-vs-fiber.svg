<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Stack Reconciler와 Fiber의 진행 위치 비교">
  <defs>
    <marker id="sv-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0066cc"/>
    </marker>
    <marker id="sv-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <line x1="380" y1="18" x2="380" y2="314" stroke="#e4e4e7" stroke-width="1"/>

  <!-- ================= LEFT : Stack Reconciler ================= -->
  <text x="30" y="36" font-size="16" font-weight="600" fill="#1d1d1f">Stack Reconciler</text>
  <text x="30" y="56" font-size="12" fill="#71717a" font-family="system-ui, sans-serif">재귀 = JS call stack</text>

  <text x="48" y="84" font-size="11" fill="#a1a1aa" font-family="system-ui, sans-serif">call stack</text>
  <rect x="48" y="90" width="206" height="128" rx="8" fill="none" stroke="#d4d4d8" stroke-dasharray="5 4"/>
  <g font-size="13" text-anchor="middle">
    <rect x="62" y="98" width="178" height="36" rx="6" fill="#eff6ff" stroke="#0066cc"/>
    <text x="151" y="121" fill="#1d1d1f">reconcile(Item)</text>
    <rect x="62" y="138" width="178" height="36" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="151" y="161" fill="#1d1d1f">reconcile(List)</text>
    <rect x="62" y="178" width="178" height="36" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="151" y="201" fill="#1d1d1f">reconcile(App)</text>
  </g>

  <rect x="30" y="244" width="324" height="30" rx="15" fill="#fef2f2" stroke="#fecaca"/>
  <path d="M44,253 L52,265 M52,253 L44,265" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
  <text x="62" y="263" font-size="12.5" fill="#dc2626" font-family="system-ui, sans-serif">한 번 시작하면 끝까지, 중간에 못 멈춘다</text>
  <text x="30" y="298" font-size="12" fill="#71717a" font-family="system-ui, sans-serif">진행 위치가 stack 안에 있어 멈추면 사라진다</text>

  <!-- ================= RIGHT : Fiber ================= -->
  <text x="404" y="36" font-size="16" font-weight="600" fill="#1d1d1f">Fiber</text>
  <text x="404" y="56" font-size="12" fill="#71717a" font-family="system-ui, sans-serif">반복 + workInProgress 변수</text>

  <rect x="537" y="84" width="150" height="26" rx="13" fill="#eff6ff" stroke="#0066cc"/>
  <text x="612" y="101" font-size="12" fill="#0066cc" text-anchor="middle">workInProgress</text>
  <path d="M612,110 L612,151" stroke="#0066cc" stroke-width="2" fill="none" marker-end="url(#sv-blue)"/>

  <g font-size="12.5" text-anchor="middle">
    <rect x="404" y="153" width="72" height="38" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="440" y="177" fill="#1d1d1f">App</text>
    <rect x="490" y="153" width="72" height="38" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="526" y="177" fill="#1d1d1f">Header</text>
    <rect x="576" y="153" width="72" height="38" rx="6" fill="#eff6ff" stroke="#0066cc"/>
    <text x="612" y="177" fill="#1d1d1f">List</text>
    <rect x="662" y="153" width="72" height="38" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="698" y="177" fill="#1d1d1f">Item</text>
  </g>
  <g stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#sv-teal)">
    <path d="M476,172 L488,172"/>
    <path d="M562,172 L574,172"/>
    <path d="M648,172 L660,172"/>
  </g>

  <rect x="400" y="244" width="336" height="30" rx="15" fill="#f0fdfa" stroke="#99f6e4"/>
  <path d="M414,260 L418,265 L425,255" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="434" y="263" font-size="12.5" fill="#0d9488" font-family="system-ui, sans-serif">멈춰도 멈춘 지점부터 다시 이어간다</text>
  <text x="400" y="298" font-size="12" fill="#71717a" font-family="system-ui, sans-serif">진행 위치가 변수에 담겨 멈춰도 남는다</text>
</svg>
